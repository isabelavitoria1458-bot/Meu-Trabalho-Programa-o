<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ALTERAÇÃO: título da aba do navegador -->
    <title>Inteligência Acadêmica</title>

    <link rel="stylesheet" href="style.css">

    <!-- Fonte Zen Dots -->
    <link href="https://fonts.googleapis.com/css2?family=Zen+Dots&display=swap" rel="stylesheet">
</head>

<body>

    <div class="container">

        <!-- ALTERAÇÃO: título principal da página -->
        <h1>Sistema de Gestão de Notas</h1>

        <form id="form-aluno">

            <label for="nome">Nome do aluno</label>
            <input
                type="text"
                id="nome"
                placeholder="Digite o nome"
                required
            >

            <label for="nota1">Nota 1</label>
            <input
                type="number"
                id="nota1"
                placeholder="0 a 10"
                min="0"
                max="10"
                step="0.1"
                required
            >

            <label for="nota2">Nota 2</label>
            <input
                type="number"
                id="nota2"
                placeholder="0 a 10"
                min="0"
                max="10"
                step="0.1"
                required
            >

            <label for="nota3">Nota 3</label>
            <input
                type="number"
                id="nota3"
                placeholder="0 a 10"
                min="0"
                max="10"
                step="0.1"
                required
            >

            <!-- ALTERAÇÃO: corrigido o identificador da quarta nota para nota4 -->
            <label for="nota4">Nota 4</label>
            <input
                type="number"
                id="nota4"
                placeholder="0 a 10"
                min="0"
                max="10"
                step="0.1"
                required
            >
                
            <label for="media-exigida">Média mínima para aprovação</label>
            <input
            type="number"
            id="media-exigida"
            placeholder="Digite a média exigida"
            min="0"
            max="10"
            step="0.1"
            required
>

            <!-- Botão que aciona a função de cálculo no JavaScript -->
            <button type="button" id="btn-calcular">
                Calcular Média
            </button>
        </form>

        <div id="resultado" aria-live="polite"></div>
    
    </div>


<!-- ALTERAÇÃO: área onde o JavaScript exibirá a média e a situação -->


<!-- Conecta o HTML ao arquivo JavaScript -->
<script src="script.js"></script>


</body>
</html>
